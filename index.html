<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnglishTogether - Vercel Sync Server</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 32px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 { font-size: 26px; margin-bottom: 10px; }
    p { color: #94a3b8; line-height: 1.6; font-size: 14px; margin-bottom: 18px; }
    .endpoint-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      font-family: Consolas, monospace;
      color: #38bdf8;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Server Online</div>
    <h1>EnglishTogether Cloud Sync</h1>
    <p>Server đồng bộ Flashcard theo Gmail đang hoạt động. Hãy sao chép địa chỉ Server dưới đây và dán vào mục <b>Setting &rarr; Vercel Server URL</b> trong Extension.</p>
    <div class="endpoint-box">
      <span id="serverUrl"></span>
      <button onclick="copyUrl()">Sao chép</button>
    </div>
    <p style="margin-bottom:0;font-size:12px;">API Endpoint: <code>/api/sync</code> &bull; Hỗ trợ Vercel KV (Upstash Redis) &amp; Serverless Storage.</p>
  </div>
  <script>
    const originUrl = window.location.origin;
    document.getElementById('serverUrl').textContent = originUrl;
    function copyUrl() {
      navigator.clipboard.writeText(originUrl);
      alert('Đã sao chép URL Server: ' + originUrl);
    }
  </script>
</body>
</html>
